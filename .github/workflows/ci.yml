name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx vitest run --coverage --reporter=default --reporter=json --outputFile=coverage/test-results.json
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/coverage/test-results.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run --coverage --reporter=default --reporter=json --outputFile=coverage/test-results.json
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/test-results.json

  sonarcloud:
    name: SonarCloud Quality Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Rewrite lcov paths relative to repo root
        run: |
          node scripts/normalize-lcov.js backend/coverage/lcov.info backend/
          node scripts/normalize-lcov.js frontend/coverage/lcov.info frontend/
      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Fail the build if the quality gate is not passed
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-cases:
    name: Test Case Report
    needs: [backend, frontend, sonarcloud]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: backend-test-results
          path: backend/coverage
      - uses: actions/download-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage
      - name: Generate TestCases.csv and fail if any test case failed
        run: node scripts/generate-test-cases.js
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Commit updated TestCases.csv
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TestCases.csv
          if ! git diff --staged --quiet; then
            git commit -m "chore: update TestCases.csv [skip ci]"
            git push
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [frontend, backend, sonarcloud, test-cases]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
